<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Chat - Open Assistant</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">

    <!-- PWA Manifest -->
    <!-- Served as a static asset (not /api/pwa/manifest.json) so the platform
         proxy doesn't auth-gate it and trigger a CSP/redirect violation. -->
    <link rel="manifest" href="/static/manifest.json">

    <!-- Theme Colors (theme.js keeps theme-color in sync with light/dark) -->
    <meta name="theme-color" content="#f7f7f5">
    <meta name="msapplication-TileColor" content="#f7f7f5">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Assistant">
    <meta name="application-name" content="Open Assistant">

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/static/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="72x72" href="/static/icons/icon-72x72.png">
    <link rel="apple-touch-icon" sizes="96x96" href="/static/icons/icon-96x96.png">
    <link rel="apple-touch-icon" sizes="128x128" href="/static/icons/icon-128x128.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/static/icons/icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/static/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/static/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="384x384" href="/static/icons/icon-384x384.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/static/icons/icon-512x512.png">

    <!-- Design system -->
    <script src="/static/js/theme.js"></script>
    <link rel="preload" href="/static/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/mobile.css">
    <link rel="stylesheet" href="/static/css/pages/chat.css">
</head>
<body class="page-chat">
    <!-- Navigation (rendered by js/components.js) -->
    <div id="navbar-root"></div>

    <!-- Main Content -->
    <div class="page-content">
    <div class="main-container">
        <div class="chat-layout" id="chatLayout">
            <!-- Conversation Sidebar -->
            <div class="conversation-sidebar" id="conversationSidebar">
                <div class="sidebar-header">
                    <h3>Conversations</h3>
                    <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="Close conversation history">
                        <svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg>
                    </button>
                </div>
                <div class="sidebar-filters">
                    <input type="text" id="conversationSearch" placeholder="Search messages" aria-label="Search messages" />
                    <select id="dateFilter">
                        <option value="all">All time</option>
                        <option value="today">Today</option>
                        <option value="week">This week</option>
                        <option value="month">This month</option>
                        <option value="older">Older</option>
                    </select>
                </div>
                <div class="sidebar-content" id="conversationList">
                    <!-- Conversation cards rendered by JS -->
                </div>
                <div class="sidebar-footer">
                    <button id="loadMoreConversations">Load more</button>
                </div>
            </div>

            <!-- Chat Container -->
            <div class="chat-container">
                <div class="chat-header">
                    <div class="chat-header-left">
                        <button id="toggleSidebarBtn" class="sidebar-toggle-btn" title="Conversation history" aria-label="Toggle conversation history">
                            <svg class="icon icon-md" aria-hidden="true"><use href="#icon-history"></use></svg>
                        </button>
                        <div class="chat-header-title">Chat</div>
                        <span class="conversation-id" id="conversationIdDisplay">New conversation</span>
                    </div>
                    <div class="chat-header-actions">
                        <button id="newConversationBtn" class="btn btn-secondary btn-sm">
                            <svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
                            New chat
                        </button>
                    </div>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <div class="message assistant">
                        <div class="message-content">
                            Hello! I'm your personal assistant. How can I help you today?
                        </div>
                    </div>
                </div>

                <div class="chat-input-container">
                    <!-- Hidden file picker - triggered by the paperclip button -->
                    <input type="file" id="fileInput" multiple hidden />
                    <div class="composer">
                        <!-- Attached file chips appear above the textarea -->
                        <div id="attachmentChips" class="attachment-chips" hidden></div>
                        <div class="composer-row">
                            <button id="attachButton" class="composer-btn attach-btn" title="Attach files" aria-label="Attach files">
                                <svg class="icon" aria-hidden="true"><use href="#icon-paperclip"></use></svg>
                            </button>
                            <div class="chat-input-inner">
                                <label for="messageInput" class="sr-only">Message</label>
                                <textarea
                                    id="messageInput"
                                    placeholder="Ask me anything…"
                                    rows="1"
                                    autocomplete="off"
                                ></textarea>
                            </div>
                            <button id="cancelButton" class="composer-btn cancel-btn" hidden title="Stop ongoing work">
                                <svg class="icon" aria-hidden="true"><use href="#icon-stop"></use></svg>
                                Stop
                            </button>
                            <button id="sendButton" class="composer-btn send-btn" title="Send message" aria-label="Send message">
                                <svg class="icon" aria-hidden="true"><use href="#icon-send"></use></svg>
                            </button>
                        </div>
                    </div>
                    <p class="composer-hint"><kbd>Enter</kbd> to send · <kbd>Shift</kbd> + <kbd>Enter</kbd> for a new line</p>
                </div>
            </div>
        </div>
    </div>
    </div>

    <!-- Cancel confirmation modal -->
    <div class="modal-overlay hidden" id="cancelModal" role="dialog" aria-modal="true" aria-labelledby="cancelModalTitle">
        <div class="modal-card">
            <div class="modal-icon">
                <svg class="icon" aria-hidden="true"><use href="#icon-alert"></use></svg>
            </div>
            <div class="modal-title" id="cancelModalTitle">Stop ongoing work?</div>
            <div class="modal-body">
                This will cancel all background tasks for this conversation.
                You can send a new request straight away.
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="cancelModalDismiss">Keep waiting</button>
                <button class="btn btn-destructive" id="cancelModalConfirm">Yes, stop it</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/js/marked.min.js"></script>
    <script src="/static/js/purify.min.js"></script>
    <script src="/static/js/components.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/chat.js"></script>
    <script src="/static/js/pwa.js"></script>
</body>
</html>
