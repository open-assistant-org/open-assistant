<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected Artifact - Open Assistant</title>
    <!-- This page is served to anonymous visitors and must stay fully
         self-contained: on deployments where only the artifact route is
         public (e.g. behind an authenticating reverse proxy), any
         same-origin asset reference would bounce the visitor to a login
         wall. Everything the gate needs is inlined below — add no external
         references here. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%2300ff00'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #141414;
            --border: #262626;
            --primary: #00ff00;
            --text: #e5e5e5;
            --muted: #8a8a8a;
            --error: #ff5555;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
        }
        .gate-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 32px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
        }
        .gate-logo {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
        }
        .gate-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0 0 8px;
        }
        .gate-subtitle {
            color: var(--muted);
            font-size: 0.9rem;
            margin: 0 0 24px;
        }
        .gate-input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #0d0d0d;
            color: var(--text);
            font-size: 1rem;
            margin-bottom: 14px;
        }
        .gate-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .gate-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: #0a0a0a;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .gate-button:hover { opacity: 0.85; }
        .gate-button:disabled { opacity: 0.5; cursor: not-allowed; }
        .gate-error {
            color: var(--error);
            font-size: 0.85rem;
            min-height: 1.2em;
            margin: 12px 0 0;
        }
    </style>
</head>
<body>
    <div class="gate-card">
        <svg class="gate-logo" width="64" height="64" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Open Assistant">
            <circle cx="128" cy="128" r="120" fill="#00ff00"/>
            <rect x="78" y="90" width="100" height="90" rx="15" fill="#0a0a0a" stroke="#00ff00" stroke-width="3"/>
            <line x1="128" y1="70" x2="128" y2="90" stroke="#00ff00" stroke-width="4" stroke-linecap="round"/>
            <circle cx="128" cy="70" r="6" fill="#00ff00"/>
            <circle cx="100" cy="120" r="12" fill="#00ff00"/>
            <circle cx="156" cy="120" r="12" fill="#00ff00"/>
            <circle cx="103" cy="117" r="4" fill="#0a0a0a"/>
            <circle cx="159" cy="117" r="4" fill="#0a0a0a"/>
            <rect x="95" y="150" width="66" height="20" rx="10" fill="#00ff00" opacity="0.3"/>
            <line x1="100" y1="155" x2="100" y2="165" stroke="#00ff00" stroke-width="2"/>
            <line x1="110" y1="155" x2="110" y2="165" stroke="#00ff00" stroke-width="2"/>
            <line x1="120" y1="155" x2="120" y2="165" stroke="#00ff00" stroke-width="2"/>
            <line x1="130" y1="155" x2="130" y2="165" stroke="#00ff00" stroke-width="2"/>
            <line x1="140" y1="155" x2="140" y2="165" stroke="#00ff00" stroke-width="2"/>
            <line x1="150" y1="155" x2="150" y2="165" stroke="#00ff00" stroke-width="2"/>
            <path d="M 65 180 Q 50 200 55 210" fill="#00ff00"/>
            <circle cx="85" cy="105" r="3" fill="#00ff00" opacity="0.5"/>
            <line x1="85" y1="105" x2="95" y2="115" stroke="#00ff00" stroke-width="1" opacity="0.5"/>
            <circle cx="171" cy="105" r="3" fill="#00ff00" opacity="0.5"/>
            <line x1="171" y1="105" x2="161" y2="115" stroke="#00ff00" stroke-width="1" opacity="0.5"/>
        </svg>
        <h1 class="gate-title">Protected Artifact</h1>
        <p class="gate-subtitle">This content is passphrase-protected. Enter the passphrase to continue.</p>
        <form id="gate-form">
            <input id="passphrase" class="gate-input" type="password" placeholder="Passphrase" autocomplete="off" autofocus>
            <button id="gate-submit" class="gate-button" type="submit">Unlock</button>
        </form>
        <p id="gate-error" class="gate-error"></p>
    </div>

    <script>
        const form = document.getElementById('gate-form');
        const errEl = document.getElementById('gate-error');
        const btn = document.getElementById('gate-submit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const passphrase = document.getElementById('passphrase').value;
            if (!passphrase) return;

            // The gate is shown at /artifact/{id} — unlock lives at /artifact/{id}/unlock.
            const unlockUrl = window.location.pathname + '/unlock' + window.location.search;

            errEl.textContent = '';
            btn.disabled = true;
            try {
                const res = await fetch(unlockUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ passphrase })
                });
                if (res.ok) {
                    // Cookie is set; reloading /view now serves the artifact.
                    window.location.reload();
                } else {
                    errEl.textContent = 'Incorrect passphrase. Please try again.';
                    btn.disabled = false;
                }
            } catch (err) {
                errEl.textContent = 'Something went wrong. Please try again.';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
