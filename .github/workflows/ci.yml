name: CI

on:
  pull_request:
    branches: [main]

# Read-only on purpose: pull requests from forks always get a read-only token.
# The PR comment is posted by coverage-comment.yml, which runs after this
# workflow with write access and never runs code from the PR.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run black formatter check
        run: uv run black --check .

      - name: Run pytest
        run: uv run pytest --cov=src --cov-report=xml

      - name: Coverage Summary
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const fs = require('fs');
            const xml = fs.readFileSync('coverage.xml', 'utf8');
            const covered = parseInt(xml.match(/lines-covered="(\d+)"/)?.[1] ?? '', 10);
            const total = parseInt(xml.match(/lines-valid="(\d+)"/)?.[1] ?? '', 10);
            const pct = total > 0 ? Math.round((covered / total) * 100) : null;
            const line = pct === null
              ? 'Coverage: unknown'
              : `Coverage: ${pct}% (${covered}/${total} lines)`;
            console.log(line);

            await core.summary.addHeading('Coverage').addRaw(line).write();

            // Data for coverage-comment.yml, which posts it on the PR.
            fs.mkdirSync('coverage-comment', { recursive: true });
            fs.writeFileSync('coverage-comment/coverage.json', JSON.stringify({
              pr: parseInt(process.env.PR_NUMBER, 10),
              covered,
              total,
            }));

      - name: Upload coverage to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

      - name: Upload coverage comment data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-comment
          path: coverage-comment/coverage.json
          retention-days: 1
