name: Coverage Comment

# Runs after CI finishes, in the context of this repository, so it gets a
# write token even when the PR comes from a fork. It never checks out or runs
# PR code: it only reads the coverage numbers CI uploaded and posts them.
# Note: workflow_run only fires for workflow files on the default branch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write

    steps:
      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-comment
          path: ${{ runner.temp }}/coverage-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post or update coverage comment
        uses: actions/github-script@v7
        env:
          DATA_FILE: ${{ runner.temp }}/coverage-comment/coverage.json
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const fs = require('fs');
            // The artifact was produced by PR code, so treat it as untrusted:
            // accept only integers and verify the PR number against the run.
            const data = JSON.parse(fs.readFileSync(process.env.DATA_FILE, 'utf8'));
            const prNumber = Number(data.pr);
            const covered = Number(data.covered);
            const total = Number(data.total);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid PR number in artifact: ${data.pr}`);
              return;
            }

            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            if (pr.head.sha !== process.env.HEAD_SHA) {
              core.setFailed(`PR #${prNumber} head ${pr.head.sha} does not match CI run head ${process.env.HEAD_SHA}`);
              return;
            }

            const valid = Number.isInteger(covered) && Number.isInteger(total) && total > 0;
            const marker = '<!-- coverage-comment -->';
            const body = valid
              ? `${marker}\n## Coverage\n\n**${Math.round((covered / total) * 100)}%** (${covered}/${total} lines)`
              : `${marker}\n## Coverage\n\nCoverage data unavailable.`;

            // Update the existing coverage comment instead of adding a new one per push.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }
